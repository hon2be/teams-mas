name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 저장소 Settings → Secrets and variables → Actions → Variables 에 등록한다.
          # 비밀이 아니라 공개 식별자라 Secrets 가 아닌 Variables 로 충분하다.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ROUTER: hash
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_TEAMS_APP_ID: ${{ vars.VITE_TEAMS_APP_ID }}
          VITE_SHAREPOINT_HOSTNAME: ${{ vars.VITE_SHAREPOINT_HOSTNAME }}
          VITE_SHAREPOINT_SITE_PATH: ${{ vars.VITE_SHAREPOINT_SITE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
