<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" fill="#4643D9"/>
  <g fill="#ffffff">
    <!-- 상단 바: 회의 헤더 -->
    <rect x="36" y="40" width="120" height="10" rx="5" opacity="0.55"/>
