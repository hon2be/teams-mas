    <rect x="36" y="68"  width="16" height="16" rx="4" opacity="0.35"/>
    <rect x="57" y="68"  width="16" height="16" rx="4"/>
    <rect x="78" y="68"  width="16" height="16" rx="4"/>
    <rect x="99" y="68"  width="16" height="16" rx="4" opacity="0.35"/>
    <rect x="120" y="68" width="16" height="16" rx="4"/>
    <rect x="141" y="68" width="16" height="16" rx="4" opacity="0.35"/>

    <rect x="36" y="90"  width="16" height="16" rx="4" opacity="0.35"/>
    <rect x="57" y="90"  width="16" height="16" rx="4"/>
    <rect x="78" y="90"  width="16" height="16" rx="4"/>
    <rect x="99" y="90"  width="16" height="16" rx="4"/>
    <rect x="120" y="90" width="16" height="16" rx="4"/>
    <rect x="141" y="90" width="16" height="16" rx="4" opacity="0.35"/>

    <rect x="36" y="112" width="16" height="16" rx="4"/>
    <rect x="57" y="112" width="16" height="16" rx="4"/>
    <rect x="78" y="112" width="16" height="16" rx="4"/>
