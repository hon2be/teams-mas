    <rect x="120" y="112" width="16" height="16" rx="4"/>
    <rect x="141" y="112" width="16" height="16" rx="4" opacity="0.35"/>
  </g>
  <!-- 추천된 구간을 감싸는 하이라이트 -->
  <rect x="52" y="63" width="47" height="70" rx="10" fill="none" stroke="#47BFFF" stroke-width="6"/>
</svg>
